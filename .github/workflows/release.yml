name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and validate version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Error "Ungueltiges Tag-Format: $tag (erwartet: vMAJOR.MINOR.PATCH)"
            exit 1
          }
          $version = $Matches[1]
          Write-Host "Tag: $tag"
          Write-Host "Version: $version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: Verify package.json version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $env:VERSION) {
            Write-Error "Tag-Version ($env:VERSION) stimmt nicht mit package.json ($pkg) ueberein."
            exit 1
          }
          Write-Host "package.json version OK: $pkg"

      - name: Extract release notes
        shell: pwsh
        run: |
          node scripts/extract-changelog.js $env:VERSION release-notes.md
          if (-not (Test-Path release-notes.md)) {
            Write-Error "release-notes.md wurde nicht erstellt."
            exit 1
          }
          $notes = Get-Content release-notes.md -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "release-notes.md ist leer."
            exit 1
          }
          Write-Host "Release notes extracted successfully."

      - name: Install dependencies
        run: npm ci

      - name: Prepare icons
        run: npm run icons

      - name: Build Windows artifacts
        run: npm run build

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $portable = "dist/WebcamMonitor-portable-v$env:VERSION.exe"
          $setup = "dist/WebcamMonitor-setup-v$env:VERSION.exe"
          if (-not (Test-Path $portable)) {
            Write-Error "Fehlende Datei: $portable"
            exit 1
          }
          if (-not (Test-Path $setup)) {
            Write-Error "Fehlende Datei: $setup"
            exit 1
          }
          Write-Host "Build artifacts verified:"
          Write-Host "  $portable"
          Write-Host "  $setup"

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $portableName = "WebcamMonitor-portable-v$env:VERSION.exe"
          $setupName = "WebcamMonitor-setup-v$env:VERSION.exe"
          $portablePath = "dist/$portableName"
          $setupPath = "dist/$setupName"
          $checksumFile = "dist/WebcamMonitor-SHA256SUMS-v$env:VERSION.txt"

          $portableHash = (Get-FileHash $portablePath -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()

          @(
            "$portableHash  $portableName"
            "$setupHash  $setupName"
          ) | Set-Content $checksumFile -Encoding utf8

          Write-Host "Checksum file created: $checksumFile"
          Get-Content $checksumFile

      - name: Verify checksum file
        shell: pwsh
        run: |
          $checksumFile = "dist/WebcamMonitor-SHA256SUMS-v$env:VERSION.txt"
          if (-not (Test-Path $checksumFile)) {
            Write-Error "Checksum-Datei fehlt: $checksumFile"
            exit 1
          }
          $content = Get-Content $checksumFile -Raw
          $portableName = "WebcamMonitor-portable-v$env:VERSION.exe"
          $setupName = "WebcamMonitor-setup-v$env:VERSION.exe"
          if ($content -notmatch [regex]::Escape($portableName)) {
            Write-Error "Checksum-Datei enthaelt nicht: $portableName"
            exit 1
          }
          if ($content -notmatch [regex]::Escape($setupName)) {
            Write-Error "Checksum-Datei enthaelt nicht: $setupName"
            exit 1
          }
          Write-Host "Checksum file verified."

      - name: Prepare SSH connection
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          foreach ($name in @('DEPLOY_SSH_KEY', 'DEPLOY_KNOWN_HOSTS', 'DEPLOY_HOST', 'DEPLOY_USER', 'DEPLOY_PATH')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              Write-Error "$name secret fehlt."
              exit 1
            }
          }

          $sshDir = Join-Path $env:USERPROFILE '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir 'deploy_key'
          $knownHostsPath = Join-Path $sshDir 'known_hosts_deploy'

          $keyContent = $env:DEPLOY_SSH_KEY.TrimEnd("`r", "`n") + "`n"
          [System.IO.File]::WriteAllText($keyPath, $keyContent)
          [System.IO.File]::WriteAllText($knownHostsPath, $env:DEPLOY_KNOWN_HOSTS.Trim())

          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          "SSH_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "SSH_KNOWN_HOSTS_PATH=$knownHostsPath" >> $env:GITHUB_ENV
          Write-Host "SSH connection prepared."

      - name: Verify remote deploy path
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          $remoteTarget = "${env:DEPLOY_USER}@${env:DEPLOY_HOST}"
          $remoteCmd = "test -d `"$($env:DEPLOY_PATH)`" && test -w `"$($env:DEPLOY_PATH)`""

          & ssh `
            -i $env:SSH_KEY_PATH `
            -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
            -o IdentitiesOnly=yes `
            -o BatchMode=yes `
            $remoteTarget `
            $remoteCmd

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Deploy path missing or not writable on server."
            exit 1
          }

          Write-Host "Remote deploy path verified."

      - name: Upload release files to server
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          $portable = "dist/WebcamMonitor-portable-v$env:VERSION.exe"
          $setup = "dist/WebcamMonitor-setup-v$env:VERSION.exe"
          $checksum = "dist/WebcamMonitor-SHA256SUMS-v$env:VERSION.txt"
          $remoteTarget = "${env:DEPLOY_USER}@${env:DEPLOY_HOST}:$($env:DEPLOY_PATH)/"

          & scp `
            -i $env:SSH_KEY_PATH `
            -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
            -o IdentitiesOnly=yes `
            -o BatchMode=yes `
            $portable `
            $setup `
            $checksum `
            $remoteTarget

          if ($LASTEXITCODE -ne 0) {
            Write-Error "SCP upload failed."
            exit 1
          }

          Write-Host "Release files uploaded to server."

      - name: Verify server release files
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          $portableName = "WebcamMonitor-portable-v$env:VERSION.exe"
          $setupName = "WebcamMonitor-setup-v$env:VERSION.exe"
          $checksumName = "WebcamMonitor-SHA256SUMS-v$env:VERSION.txt"
          $remoteTarget = "${env:DEPLOY_USER}@${env:DEPLOY_HOST}"
          $remoteCmd = @"
          test -f `"$($env:DEPLOY_PATH)/$portableName`" &&
          test -f `"$($env:DEPLOY_PATH)/$setupName`" &&
          test -f `"$($env:DEPLOY_PATH)/$checksumName`"
          "@

          & ssh `
            -i $env:SSH_KEY_PATH `
            -o "UserKnownHostsFile=$env:SSH_KNOWN_HOSTS_PATH" `
            -o IdentitiesOnly=yes `
            -o BatchMode=yes `
            $remoteTarget `
            $remoteCmd

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Server file verification failed."
            exit 1
          }

          Write-Host "Server release files verified."

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            "dist/WebcamMonitor-portable-v$env:VERSION.exe" `
            "dist/WebcamMonitor-setup-v$env:VERSION.exe" `
            "dist/WebcamMonitor-SHA256SUMS-v$env:VERSION.txt" `
            --title "Webcam Monitor $env:TAG" `
            --notes-file release-notes.md
